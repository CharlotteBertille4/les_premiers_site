stages:
  - mirror

# Job pour synchroniser vers GitHub
mirror_to_github:
  stage: mirror
  image: alpine/git
  only:
    - main
  script:
    - git remote add github https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/$GITHUB_USERNAME/$GITHUB_REPO.git || true
    - git push github HEAD:main --force
  variables:
    GIT_STRATEGY: clone