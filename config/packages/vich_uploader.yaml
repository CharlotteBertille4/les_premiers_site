# config/packages/vich_uploader.yaml
vich_uploader:
  db_driver: orm
  mappings:
    etablissement_image:
      uri_prefix: /uploads/images/etablissements
      upload_destination: '%kernel.project_dir%/public/uploads/images/etablissements'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

    gallery_images:
        uri_prefix: /uploads/images/galleries
        upload_destination: '%kernel.project_dir%/public/uploads/images/galleries'
        namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
